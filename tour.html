    <main class="page-main">

        <section class="tour-dates">
            <div class="container">
                <h2>Upcoming Events</h2>

                    <select id="locationFilter">

                    <!-- Tour events will be loaded dynamically -->

    <style>
        .show-details-btn {
            padding: 0.5rem 1rem;
            background-color: transparent;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #333;
            transition: all 0.3s ease;
        }

        .show-details-btn:hover {
            background-color: #f0f0f0;
            border-color: #ccc;
        }

        .event-details {
            margin-top: 1rem;
            padding: 1rem;
            background-color: #f8f8f8;
            border-radius: 4px;
            grid-column: 1 / -1;
        }

        .event-details p {
            font-family: inherit;
            line-height: 1.6;
            color: #555;
            margin: 0;
        }

        .tour-item {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 2rem;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 0;
            transition: background-color 0.3s ease;
        }

        .tour-action {
            text-align: right;
            display: flex;
            justify-content: flex-end;
        }
    </style>

    <script src="events.js"></script>
    <script>
        // Header remains fixed - no hide/show functionality needed

        // Load all tour events on page load
        document.addEventListener('DOMContentLoaded', function() {
            populateLocationFilter();
            loadAllTourEvents();

            // Add event listener for location filter
            document.getElementById('locationFilter').addEventListener('change', function() {
                loadAllTourEvents();
            });

            // Mobile hamburger menu functionality
            const hamburgerMenu = document.querySelector('.hamburger-menu');
            const mobileOverlay = document.querySelector('.mobile-nav-overlay');
            if (hamburgerMenu) {
                hamburgerMenu.addEventListener('click', function() {
                    this.classList.toggle('active');
                    if (mobileOverlay) {
                        mobileOverlay.style.display = mobileOverlay.style.display === 'flex' ? 'none' : 'flex';
                    }
                });
            }
            // Close mobile menu when clicking on overlay or menu items
            if (mobileOverlay) {
                mobileOverlay.addEventListener('click', function(e) {
                    if (e.target === this || e.target.tagName === 'A') {
                        this.style.display = 'none';
                        hamburgerMenu.classList.remove('active');
                    }
                });
            }
        });

        function populateLocationFilter() {
            const allEvents = getUpcomingEvents();
            const locations = [...new Set(allEvents.map(event => event.location))].sort();
            const filterSelect = document.getElementById('locationFilter');
            
            locations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                filterSelect.appendChild(option);
            });
        }

        function loadAllTourEvents() {
            const allEvents = getUpcomingEvents();
            const selectedLocation = document.getElementById('locationFilter').value;

            // Filter events by location if selected
            const filteredEvents = selectedLocation
                ? allEvents.filter(event => event.location === selectedLocation)
                : allEvents;

            const container = document.getElementById('tourList');

            if (filteredEvents.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No upcoming events scheduled for this location.</p>';
                return;
            }

            container.innerHTML = '';

            filteredEvents.forEach((event, index) => {
                const formattedDate = formatDate(event.date);
                const tourItem = document.createElement('div');
                tourItem.className = 'tour-item';

                tourItem.innerHTML = `
                    <div class="tour-date">
                        <span class="date-text">${formattedDate.month} ${formattedDate.day}</span>
                    </div>
                    <div class="tour-details">
                        <h3 class="venue-name">${event.venue}</h3>
                        <p class="venue-location">${event.location}</p>
                    </div>
                    <div class="tour-action">
                        <button class="show-details-btn" onclick="toggleDetails(${index})">Show Details</button>
                    </div>
                    <div class="event-details" id="details-${index}" style="display: none;">
                        <p>${event.details || 'Details coming soon...'}</p>
                    </div>
                `;

                container.appendChild(tourItem);
            });
        }

        // Function to toggle event details display (same as lyrics functionality)
        function toggleDetails(index) {
            const detailsDiv = document.getElementById(`details-${index}`);
            const button = document.querySelector(`[onclick="toggleDetails(${index})"]`);

            if (detailsDiv.style.display === 'none') {
                detailsDiv.style.display = 'block';
                button.textContent = 'Hide Details';
            } else {
                detailsDiv.style.display = 'none';
                button.textContent = 'Show Details';
            }
        }
    </script>
